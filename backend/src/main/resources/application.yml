server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  application:
    name: vyaparsathi-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vyaparsathi_db}
    username: ${SPRING_DATASOURCE_USERNAME:vyaparsathi}
    password: ${SPRING_DATASOURCE_PASSWORD:vyaparsathi_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:vyaparsathi_jwt_secret_key_change_in_production_32_bytes_min}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days in milliseconds

neon:
  auth:
    jwks-url: ${NEON_AUTH_JWKS_URL:https://ep-soft-sea-azj085ia.neonauth.c-3.ap-southeast-1.aws.neon.tech/neondb/auth/.well-known/jwks.json}
