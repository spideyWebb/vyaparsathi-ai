services:
  - type: web
    name: vyaparsathi-api
    runtime: docker
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vyaparsathi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vyaparsathi-cache
          property: connectionString

  - type: worker
    name: vyaparsathi-agent-worker
    runtime: docker
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: agent-worker

databases:
  - name: vyaparsathi-db
    plan: standard
    postgresMajorVersion: 15

  - name: vyaparsathi-cache
    type: redis
    plan: standard
    ipAllowList: []
